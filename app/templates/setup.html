{% extends "base.html" %}
{% block title %}Set up · OpnDoor{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<div class="card auth">
  <div class="brand big"><span class="logo"></span>OpnDoor</div>
  <p class="muted">Welcome. Create the first administrator account. You can add other people afterwards.</p>
  <form method="post" action="/setup">
    <label>Your name <input name="name" required autofocus></label>
    <label>Email <input type="email" name="email" required autocomplete="username"></label>
    <label>Password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="primary wide">Create admin account</button>
  </form>
</div>
{% endblock %}
