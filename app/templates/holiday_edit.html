{% extends "base.html" %}
{% block title %}Edit {{ h.name }} · Holidays · OpnDoor{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<p class="crumbs small"><a href="/holidays">Holidays</a> › {{ h.name }}</p>
<h1>Edit holiday</h1>
<section class="card">{% include "_holiday_form.html" %}</section>
<form method="post" action="/holidays/{{ h.id }}/delete" onsubmit="return confirm('Remove {{ h.name|e }}?')" style="margin-top:1rem">
  <button class="danger">Remove this holiday</button></form>
{% endblock %}
