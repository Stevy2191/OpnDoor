<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
<style>
  :root { --bg: #0e1a2f; --card: #16253f; --text: #f3f5f9; --muted: #9fb0c8; --line: #24375a; --ok: #22c55e; --busy: #ef4444; --amber: #f5a524; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; padding: clamp(16px, 3vw, 40px); gap: clamp(16px, 2.4vw, 32px); }
  h1, h2, .big { font-family: Outfit, Inter, sans-serif; margin: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .brand { color: var(--muted); font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: .7rem; }
  .slogo { max-height: clamp(32px, 4vw, 52px); max-width: 220px; object-fit: contain; }
  .clock { text-align: right; }
  .clock .t { font-family: Outfit, sans-serif; font-size: clamp(28px, 4vw, 52px); font-weight: 700; line-height: 1; }
  .clock .d { color: var(--muted); margin-top: .3rem; }
  .muted { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
</style>
