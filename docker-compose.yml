# Deploy under /srv/docker/opndoor on the server.
services:
  opndoor:
    image: ghcr.io/stevy2191/opndoor:latest
    container_name: opndoor
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Chicago
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  # Live camera video (optional). To turn it on, put these two lines in .env:
  #   COMPOSE_PROFILES=live
  #   LIVE_VIDEO_URL=http://go2rtc:1984
  # copy go2rtc.yaml next to this file, then: docker compose up -d
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    container_name: opndoor-go2rtc
    restart: unless-stopped
    profiles: ["live"]
    # no ports: only OpnDoor talks to it, and OpnDoor checks who may watch which door
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro

  # The Update button in OpnDoor (Settings -> Updates). Optional: delete this block to turn it off.
  # It needs updater.sh next to this file and the same folder path inside and outside the container.
  updater:
    image: docker:27-cli
    container_name: opndoor-updater
    restart: unless-stopped
    working_dir: /srv/docker/opndoor
    entrypoint: ["sh", "/srv/docker/opndoor/updater.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/docker/opndoor:/srv/docker/opndoor
